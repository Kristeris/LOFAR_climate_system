# ── Database (H2 in-memory — no real MySQL needed during tests) ────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
 
# ── JPA ───────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
 
# ── Disable SQL init scripts during tests ─────────────────────────────
spring.sql.init.mode=never
 
# ── Mail — disable real SMTP during tests ─────────────────────────────
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
 
# ── Google Calendar — no real credentials needed in tests ─────────────
google.calendar.service-account-path=
google.calendar.id=primary
google.calendar.timezone=Europe/Riga
 
# ── Nohup file path — point to a safe temp location ──────────────────
nohup.file.path=/tmp/test-nohup.out
 
# ── Log files ─────────────────────────────────────────────────────────
app.log.path=/tmp/test-lofar-system.log
app.log.error.path=/tmp/test-lofar-system-error.log
 
# ── Disable scheduling during tests (avoids background threads) ───────
spring.task.scheduling.pool.size=1
 
# ── Suppress noisy logs during test runs ─────────────────────────────
logging.level.root=WARN
logging.level.lofar.system=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN