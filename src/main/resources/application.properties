spring.application.name=LOFAR-system

# ── Database ─────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/lofar_system
spring.datasource.username=lofar_admin
spring.datasource.password=passwordgobrr

# ── JPA ──────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Scheduling ───────────────────────────────────────────────────────
spring.task.scheduling.pool.size=2
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5

# ── WebSocket ────────────────────────────────────────────────────────
spring.websocket.stomp.relay-host=localhost
spring.websocket.stomp.relay-port=61613

# ── Session ──────────────────────────────────────────────────────────
server.servlet.session.timeout=600s

# ── Logging ──────────────────────────────────────────────────────────
logging.level.lofar.system=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# ── E-mail (Gmail example — replace with your credentials) ───────────
# To use Gmail you need to enable 2FA and create an App Password.
# See https://support.google.com/accounts/answer/185833
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=your-email@gmail.com
# ── Google Calendar ──────────────────────────────────────────────────
# Paste a valid OAuth2 Bearer access token below (expires after 1 hour).
# For production use a service-account JSON key + google-api-java-client.
# Leave blank to disable actual API calls (posts still save locally).
google.calendar.api.key=
google.calendar.id=primary
google.calendar.timezone=Europe/Riga