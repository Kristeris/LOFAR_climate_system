plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'lofar.system'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

//Added compiler arguments to preserve parameter names
tasks.withType(JavaCompile) {
	options.compilerArgs << '-parameters'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	
	// E-mail support
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	//google calendar api client
	implementation 'com.google.apis:google-api-services-calendar:v3-rev20220715-2.0.0'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.19.0'


	// WebSocket dependencies - THIS IS THE KEY ADDITION
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	
	// Optional: WebJars for frontend WebSocket libraries
	implementation 'org.webjars:sockjs-client:1.5.1'
	implementation 'org.webjars:stomp-websocket:2.3.4'
	
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'mysql:mysql-connector-java:8.0.31'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


	// ── Test dependencies ──────────────────────────────────────────────
 
	// Core Spring Boot test starter (includes JUnit 5, Mockito, AssertJ)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
 
	// Spring Security test support (@WithMockUser, csrf(), etc.)
	testImplementation 'org.springframework.security:spring-security-test'
 
	// H2 in-memory database — replaces MySQL during tests so no real DB needed
	testRuntimeOnly 'com.h2database:h2'

	testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
 
	// JUnit platform launcher (required by Gradle to run JUnit 5)
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
 
	// Lombok for test classes (needed if any test class uses Lombok annotations)
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// Show test results in console while running
	testLogging {
		events 'passed', 'failed', 'skipped'
		showStandardStreams = false
		exceptionFormat = 'full'
	}
}